name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev cmake

      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON -DBUILD_BENCH=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure

      - name: Run benchmark
        if: matrix.build_type == 'Release' && matrix.compiler == 'g++'
        run: ./build/bench/benchmark_throughput

      - name: Run pipeline benchmark
        if: matrix.build_type == 'Release' && matrix.compiler == 'g++'
        run: ./build/bench/benchmark_pipeline

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-17

      - name: Check formatting
        run: |
          find include src tests bench -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format-17 --dry-run --Werror --style=file 2>&1 || \
            (echo "::error::Code formatting issues found. Run 'clang-format -i' locally." && exit 1)

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev cmake clang-tidy-17 clang-17

      - name: Configure with compile commands
        run: cmake -B build -DCMAKE_CXX_COMPILER=clang++-17 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF

      # Advisory: findings are reported as annotations and do not fail the job.
      # Each file gets its own time limit so one slow translation unit cannot stall the job.
      - name: Run clang-tidy (advisory)
        timeout-minutes: 20
        run: |
          for f in $(find src -name '*.cpp' | sort); do
            echo "::group::clang-tidy $f"
            rc=0
            timeout 180 clang-tidy-17 -p build --quiet "$f" 2>&1 || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 124 ]; then
              echo "::warning file=$f::clang-tidy timed out after 180 s"
            elif [ "$rc" -ne 0 ]; then
              echo "::notice file=$f::clang-tidy exited with $rc"
            fi
          done
